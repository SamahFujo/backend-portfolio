version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install -r requirements.txt
      - python workportfolio/manage.py collectstatic --noinput
run:
  runtime-version: 3.11
  command: gunicorn workportfolio.wsgi:application --chdir workportfolio --bind 0.0.0.0:$PORT --workers 2 --timeout 120
  network:
    port: 8000
  env:
    - name: PYTHONUNBUFFERED
      value: "1"